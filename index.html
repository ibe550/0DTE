<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX 0DTE DEFENDER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #131827; border: 1px solid #1e293b; border-radius: 8px; }
    </style>
</head>
<body class="p-3 max-w-5xl mx-auto">

    <!-- SPX 가격 요약 카드 예시 (실시간 데이터 연동 대상) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 mb-3">
        <div class="card p-3">
            <div class="text-[11px] text-gray-400 font-medium mb-1">SPX</div>
            <div id="spx-price" class="text-xl font-bold text-emerald-400 tracking-tight">로딩 중...</div>
            <div id="spx-change" class="text-xs font-semibold text-emerald-400 mt-0.5">-</div>
        </div>
        <div class="card p-3">
            <div class="text-[11px] text-gray-400 font-medium mb-1">VIX</div>
            <div id="vix-price" class="text-base font-bold text-emerald-400">14.81</div>
        </div>
        <div class="card p-3">
            <div class="text-[11px] text-gray-400 font-medium mb-1">ES</div>
            <div id="es-price" class="text-xl font-bold text-emerald-400 tracking-tight">7712.50</div>
        </div>
        <div class="card p-3">
            <div class="text-[11px] text-gray-400 font-medium mb-1">MAG7</div>
            <div id="mag7-price" class="text-xl font-bold text-red-400 tracking-tight">70.51</div>
        </div>
    </div>

    <!-- 백엔드 데이터 연동 스크립트 -->
    <script>
        async function fetchMarketData() {
            try {
                // 로컬 테스트 시 백엔드 주소 (예: http://localhost:8000/api/market-data)
                const response = await fetch('http://localhost:8000/api/market-data');
                const data = await response.json();

                if (data.status === "success") {
                    // 서버에서 받은 데이터로 화면 텍스트 갱신
                    document.getElementById('spx-price').innerText = data.spx.price;
                    document.getElementById('spx-change').innerText = `${data.spx.change} (${data.spx.change_pct}%)`;
                    console.log("데이터 갱신 완료 소스:", data.source);
                }
            } catch (error) {
                console.error("서버 통신 실패:", error);
            }
        }

        // 페이지 로드 직후 실행 및 3초마다 자동 갱신
        fetchMarketData();
        setInterval(fetchMarketData, 3000);
    </script>
</body>
</html>
